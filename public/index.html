<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Photo Studio</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, Helvetica, sans-serif;
  background: #111;
  color: #fff;
}

.container {
  max-width: 700px;
  margin: auto;
  padding: 18px;
}

h1 {
  text-align: center;
  margin: 5px 0 8px;
}

.subtitle {
  text-align: center;
  color: #aaa;
  font-size: 13px;
  margin-bottom: 20px;
}

.card {
  background: #1c1c1c;
  padding: 16px;
  border-radius: 16px;
  margin-bottom: 15px;
}

label {
  display: block;
  margin-bottom: 8px;
  font-weight: bold;
}

textarea,
button {
  width: 100%;
  border: none;
  border-radius: 10px;
  padding: 13px;
  font-size: 15px;
}

textarea {
  background: #292929;
  color: #fff;
  outline: none;
  min-height: 130px;
  resize: vertical;
  font-family: inherit;
}

button {
  background: #333;
  color: #fff;
  cursor: pointer;
  font-weight: bold;
}

button:active {
  transform: scale(.98);
}

.photo-actions {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
}

.photo-actions button {
  background: #333;
}

.photo-count {
  color: #aaa;
  font-size: 13px;
  margin: 12px 0 0;
}

.preview-grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 10px;
  margin-top: 12px;
}

.preview-item {
  min-width: 0;
  position: relative;
  background: #292929;
  border-radius: 12px;
  overflow: hidden;
}

.preview-item img {
  display: block;
  width: 100%;
  height: 220px;
  object-fit: contain;
  background: #080808;
}

.remove-photo {
  position: absolute;
  top: 7px;
  right: 7px;
  width: auto;
  padding: 7px 10px;
  background: #b42323;
  border-radius: 8px;
  font-size: 12px;
}

.photo-name {
  padding: 8px;
  font-size: 12px;
  color: #bbb;
  overflow-wrap: anywhere;
}

.quick-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 8px;
  margin-top: 10px;
}

.quick-grid button {
  background: #333;
  font-size: 13px;
}

.generate {
  background: #7c3aed;
  margin-top: 15px;
  font-size: 17px;
  padding: 15px;
}

.generate:disabled {
  opacity: .5;
  cursor: wait;
}

.status {
  margin-top: 12px;
  padding: 12px;
  background: #252525;
  border-radius: 10px;
  white-space: pre-wrap;
  word-break: break-word;
  color: #bbb;
}

.result {
  margin-top: 15px;
}

.result img {
  width: 100%;
  border-radius: 15px;
  display: block;
}

.download {
  background: #176b3a;
  margin-top: 10px;
}

.small {
  font-size: 12px;
  color: #888;
  margin-top: 8px;
  line-height: 1.5;
}

.hidden {
  display: none !important;
}

@media (max-width: 500px) {
  .container {
    padding: 12px;
  }

  .card {
    padding: 13px;
  }

  .preview-item img {
    height: 170px;
  }
}
</style>
</head>

<body>
<div class="container">

  <h1>🤖 AI Photo Studio</h1>
  <div class="subtitle">Add your photo, write a prompt and generate.</div>

  <div class="card">
    <label>📷 Add Photo</label>

    <div class="photo-actions">
      <button type="button" id="galleryBtn">🖼️ Choose from Gallery</button>
      <button type="button" id="cameraBtn">📸 Take Photo</button>
    </div>

    <input
      type="file"
      id="galleryInput"
      accept="image/jpeg,image/png,image/webp"
      multiple
      hidden
    >

    <input
      type="file"
      id="cameraInput"
      accept="image/*"
      capture="environment"
      hidden
    >

    <div id="photoCount" class="photo-count">0 of 2 photos added</div>
    <div id="previewGrid" class="preview-grid"></div>

    <p class="small">
      Add up to 2 photos. Supported formats: JPG, PNG and WEBP.
      Each photo must be 10 MB or smaller.
    </p>
  </div>

  <div class="card">
    <label for="prompt">✨ Enter Your Prompt</label>

    <textarea
      id="prompt"
      placeholder="Example: Keep the face as close to the reference photo as possible. Create a realistic portrait..."
    ></textarea>

    <div class="quick-grid">
      <button type="button" data-prompt="Keep the person's face and identity as close to the reference photo as possible. Create a natural, realistic portrait with soft daylight.">
        📸 Natural Portrait
      </button>

      <button type="button" data-prompt="Keep both people's identities and facial features as close to the reference photos as possible. Create a warm, tasteful couple portrait standing together, natural expressions.">
        ❤️ Couple Portrait
      </button>

      <button type="button" data-prompt="Keep the person's identity and face as close to the reference photo as possible. Change the outfit to elegant traditional clothes.">
        👘 Traditional Clothes
      </button>

      <button type="button" data-prompt="Keep the person's identity and face as close to the reference photo as possible. Change the hairstyle naturally to suit the person.">
        💇 Hairstyle
      </button>

      <button type="button" data-prompt="Keep the person's identity and face as close to the reference photo as possible. Replace the background with a beautiful garden at golden hour.">
        🌳 New Background
      </button>

      <button type="button" data-prompt="Keep the person's identity and face as close to the reference photo as possible. Make the expression a gentle natural smile.">
        😊 Gentle Smile
      </button>
    </div>

    <button class="generate" id="generateBtn" type="button">
      🚀 Generate Image
    </button>

    <div id="status" class="status hidden" role="status" aria-live="polite"></div>
  </div>

  <div id="resultCard" class="card result hidden">
    <label>🖼️ Generated Image</label>
    <img id="resultImage" alt="Generated AI image">

    <a id="downloadLink" class="hidden" download="ai-photo-studio.png">
      <button class="download" type="button">⬇️ Save Image</button>
    </a>
  </div>

</div>

<script>
const galleryInput = document.getElementById("galleryInput");
const cameraInput = document.getElementById("cameraInput");
const galleryBtn = document.getElementById("galleryBtn");
const cameraBtn = document.getElementById("cameraBtn");
const previewGrid = document.getElementById("previewGrid");
const photoCount = document.getElementById("photoCount");
const promptInput = document.getElementById("prompt");
const generateBtn = document.getElementById("generateBtn");
const statusBox = document.getElementById("status");
const resultCard = document.getElementById("resultCard");
const resultImage = document.getElementById("resultImage");
const downloadLink = document.getElementById("downloadLink");

const MAX_PHOTOS = 2;
const MAX_FILE_SIZE = 10 * 1024 * 1024;
const ALLOWED_TYPES = ["image/jpeg", "image/png", "image/webp"];

let selectedPhotos = [];

galleryBtn.addEventListener("click", () => galleryInput.click());
cameraBtn.addEventListener("click", () => cameraInput.click());

galleryInput.addEventListener("change", () => {
  addSelectedFiles(Array.from(galleryInput.files || []));
  galleryInput.value = "";
});

cameraInput.addEventListener("change", () => {
  addSelectedFiles(Array.from(cameraInput.files || []));
  cameraInput.value = "";
});

function addSelectedFiles(files) {
  if (files.length === 0) return;

  for (const file of files) {
    if (selectedPhotos.length >= MAX_PHOTOS) {
      showStatus("You can add a maximum of 2 photos.");
      break;
    }

    if (!ALLOWED_TYPES.includes(file.type)) {
      showStatus("Please choose a JPG, PNG or WEBP photo.");
      continue;
    }

    if (file.size > MAX_FILE_SIZE) {
      showStatus("Each photo must be 10 MB or smaller.");
      continue;
    }

    selectedPhotos.push({
      file,
      previewUrl: URL.createObjectURL(file)
    });
  }

  renderPreviews();
}

function renderPreviews() {
  previewGrid.replaceChildren();
  photoCount.textContent = `${selectedPhotos.length} of ${MAX_PHOTOS} photos added`;

  selectedPhotos.forEach((photo, index) => {
    const item = document.createElement("div");
    item.className = "preview-item";

    const image = document.createElement("img");
    image.src = photo.previewUrl;

    const removeBtn = document.createElement("button");
    removeBtn.type = "button";
    removeBtn.className = "remove-photo";
    removeBtn.textContent = "✕ Remove";

    removeBtn.addEventListener("click", () => {
      URL.revokeObjectURL(photo.previewUrl);
      selectedPhotos.splice(index, 1);
      renderPreviews();
      showStatus("");
    });

    const name = document.createElement("div");
    name.className = "photo-name";
    name.textContent = photo.file.name;

    item.append(image, removeBtn, name);
    previewGrid.append(item);
  });
}

// ✅ Quick Buttons फिक्स: प्रॉम्ट मिक्स न करता थेट स्वच्छ प्रॉम्ट सेट करतो
document.querySelectorAll("[data-prompt]").forEach(button => {
  button.addEventListener("click", () => {
    promptInput.value = button.dataset.prompt;
    promptInput.focus();
    showStatus("");
  });
});

function showStatus(message) {
  if (!message) {
    statusBox.textContent = "";
    statusBox.classList.add("hidden");
    return;
  }
  statusBox.textContent = message;
  statusBox.classList.remove("hidden");
}

async function generateImage() {
  const prompt = promptInput.value.trim();

  // 1. Validation Checks
  if (selectedPhotos.length === 0) {
    showStatus("❌ Please add at least one photo first.");
    return;
  }

  if (!prompt) {
    showStatus("❌ Error:\nPrompt is required.");
    promptInput.focus();
    return;
  }

  // 2. FormData तयार करणे
  const formData = new FormData();
  formData.append("prompt", prompt); // Backend साठी 'prompt' नाव पाठवत आहे

  selectedPhotos.forEach((photo) => {
    formData.append("images", photo.file, photo.file.name);
  });

  generateBtn.disabled = true;
  generateBtn.textContent = "⏳ Generating Image...";
  showStatus("Creating your AI image. Please wait...");
  resultCard.classList.add("hidden");

  try {
    // 3. Backend Endpoint Call (GitHub/Vercel साठी)
    const response = await fetch("/api/generate", {
      method: "POST",
      body: formData
    });

    const data = await response.json().catch(() => ({}));

    if (!response.ok) {
      throw new Error(data.error || data.message || `Server Error (${response.status})`);
    }

    if (!data.image) {
      throw new Error("No image data returned from server.");
    }

    // 4. यशस्विरित्या इमेज दाखवणे
    resultImage.src = data.image;
    downloadLink.href = data.image;
    resultCard.classList.remove("hidden");
    downloadLink.classList.remove("hidden");

    showStatus("✅ Image generated successfully!");
    resultCard.scrollIntoView({ behavior: "smooth", block: "start" });

  } catch (error) {
    showStatus("❌ Error:\n" + (error.message || "Failed to generate image. Check your backend API."));
  } finally {
    generateBtn.disabled = false;
    generateBtn.textContent = "🚀 Generate Image";
  }
}

generateBtn.addEventListener("click", generateImage);
</script>

</body>
</html>
